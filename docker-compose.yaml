name: kestra

volumes:
  postgres-data:
    driver: local

  kestra-data:
    driver: local


services:

  postgres:
    image: postgres:18

    volumes:
      - postgres-data:/var/lib/postgresql

    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 30s
      timeout: 10s
      retries: 10


  kestra:
    image: kestra/kestra:v2.0.3
    pull_policy: if_not_present

    stop_grace_period: 6m
    user: "root"

    command:
      - server
      - standalone

    volumes:
      - kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd

      # Données métier gérées par l'humain.
      # Lecture seule pour éviter qu'un flow modifie les sources.
      - ./data:/project/data:ro

      # Livrables réellement écrits sur le poste hôte.
      - ./outputs:/project/outputs

    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${POSTGRES_PASSWORD}

        kestra:
          server:
            basic-auth:
              username: ${KESTRA_USERNAME}
              password: ${KESTRA_PASSWORD}

          repository:
            type: postgres

          storage:
            type: local
            local:
              base-path: "/app/storage"

          queue:
            type: postgres

          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp

          url: http://localhost:8082/

          # Autorise les URI file:/// vers les répertoires montés.
          local-files:
            allowed-paths:
              - /project/data
              - /project/outputs

          # Autorisations propres au plugin Local Files.
          plugins:
            configurations:
              - type: io.kestra.plugin.fs.local.Downloads
                values:
                  allowed-paths:
                    - /project/data

              - type: io.kestra.plugin.fs.local.Download
                values:
                  allowed-paths:
                    - /project/data

              - type: io.kestra.plugin.fs.local.Uploads
                values:
                  allowed-paths:
                    - /project/outputs

              - type: io.kestra.plugin.fs.local.Upload
                values:
                  allowed-paths:
                    - /project/outputs

    ports:
      - "8082:8080"

    depends_on:
      postgres:
        condition: service_healthy


  kestra-init:
    image: kestra/kestractl:2.1.0

    depends_on:
      kestra:
        condition: service_started

    environment:
      KESTRACTL_HOST: http://kestra:8080
      KESTRACTL_TENANT: main
      KESTRACTL_USERNAME: ${KESTRA_USERNAME}
      KESTRACTL_PASSWORD: ${KESTRA_PASSWORD}

    volumes:
      - ./flows:/project/flows:ro
      - ./sql:/project/sql:ro
      - ./python:/project/python:ro

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -e

        echo "Attente du démarrage de Kestra..."

        until curl -fsS http://kestra:8081/health >/dev/null 2>&1; do
          sleep 5
        done

        echo "Kestra est disponible."

        echo "Déploiement du flow..."
        kestractl flows deploy /project/flows \
          --namespace comptoir.coteaux \
          --override \
          --fail-fast

        echo "Import des scripts SQL..."
        kestractl nsfiles upload comptoir.coteaux /project/sql sql \
          --no-root \
          --override \
          --fail-fast

        echo "Import des scripts Python..."
        kestractl nsfiles upload comptoir.coteaux /project/python python \
          --no-root \
          --override \
          --fail-fast

        echo "Initialisation Kestra terminée."